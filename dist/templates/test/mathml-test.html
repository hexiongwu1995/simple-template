<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="../../css/style.css"> -->
    <link rel="stylesheet" href="../../css/mathml.css">
    <title>Document</title>
</head>

<body>
    <article>

        <p>当 <math>
                <mi>𝐶</mi>
                <mo>&lt;</mo>
                <mn>0</mn>
            </math>时，对应的微分方程的通解为：<math>
                <mi>𝑋</mi>
                <mrow>
                    <mo>(</mo>
                    <mi>𝑥</mi>
                    <mo>)</mo>
                </mrow>
                <mo>=</mo>
                <msub>
                    <mi>𝐶</mi>
                    <mn>1</mn>
                </msub>
                <mo form="prefix" lspace="0.16666666666666666em" rspace="0em">cos</mo>
                <mrow>
                    <mo>(</mo>
                    <mrow>
                        <msqrt>
                            <mo>−</mo>
                            <mi>𝐶</mi>
                        </msqrt>
                        <mi>𝑥</mi>
                    </mrow>
                    <mo>)</mo>
                </mrow>
                <mo>+</mo>
                <msub>
                    <mi>𝐶</mi>
                    <mn>2</mn>
                </msub>
                <mo form="prefix" lspace="0.16666666666666666em" rspace="0em">sin</mo>
                <mrow>
                    <mo>(</mo>
                    <mrow>
                        <msqrt>
                            <mo>−</mo>
                            <mi>𝐶</mi>
                        </msqrt>
                        <mi>𝑥</mi>
                    </mrow>
                    <mo>)</mo>
                </mrow>
            </math></p>




        <div>
            <p>总能量</p><math display="block">
                <mi>𝐸</mi>
                <mrow>
                    <mo>(</mo>
                    <mi>𝑡</mi>
                    <mo>)</mo>
                </mrow>
                <mo>=</mo>
                <msubsup>
                    <mo form="prefix" lspace="0em" rspace="0em">∫</mo>
                    <mn>0</mn>
                    <msub>
                        <mi>𝐿</mi>
                        <mn>0</mn>
                    </msub>
                </msubsup>
                <mrow displaystyle="false">
                    <mo>(</mo>
                    <mrow>
                        <mfrac>
                            <msub>
                                <mi>𝜇</mi>
                                <mn>0</mn>
                            </msub>
                            <mn>2</mn>
                        </mfrac>
                        <msup>
                            <mrow>
                                <mo>(</mo>
                                <mfrac>
                                    <mrow>
                                        <mi>𝜕</mi>
                                        <mi>𝑦</mi>
                                    </mrow>
                                    <mrow>
                                        <mi>𝜕</mi>
                                        <mi>𝑡</mi>
                                    </mrow>
                                </mfrac>
                                <mo>)</mo>
                            </mrow>
                            <mn>2</mn>
                        </msup>
                        <mo>+</mo>
                        <mfrac>
                            <msub>
                                <mi>𝑇</mi>
                                <mn>0</mn>
                            </msub>
                            <mn>2</mn>
                        </mfrac>
                        <msup>
                            <mrow>
                                <mo>(</mo>
                                <mfrac>
                                    <mrow>
                                        <mi>𝜕</mi>
                                        <mi>𝑦</mi>
                                    </mrow>
                                    <mrow>
                                        <mi>𝜕</mi>
                                        <mi>𝑥</mi>
                                    </mrow>
                                </mfrac>
                                <mo>)</mo>
                            </mrow>
                            <mn>2</mn>
                        </msup>
                    </mrow>
                    <mo>)</mo>
                </mrow>
                <mi displaystyle="false">𝑑</mi>
                <mi displaystyle="false">𝑥</mi>
            </math>
        </div>
        <p>test</p>
    </article>

</body>

</html>
